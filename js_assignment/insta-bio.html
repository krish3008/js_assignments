<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Insta Bio-Link Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 560px;
      margin: 48px auto;
      padding: 24px;
      text-align: center;
      background: #f5f7ff;
      color: #26324b;
    }
    .card {
      background: white;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(30, 50, 90, 0.10);
    }
    button {
      margin: 8px;
      padding: 11px 18px;
      border: 0;
      border-radius: 9px;
      background: #5267d9;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover { background: #3f51b5; }
    a { color: #5267d9; }
    #greeting { min-height: 24px; font-weight: bold; }
  </style>
</head>
<body>
  <main class="card">
    <h1>My Insta Bio-Link Page</h1>
    <p>Hi! Welcome to my little corner of the internet.</p>

    <h2 id="food-heading">Top 3 Food Apps</h2>
    <p>1. Zomato · 2. Swiggy · 3. Uber Eats</p>

    <button id="show-bio">Show Bio</button>
    <button id="show-greeting">Show Greeting</button>
    <p id="greeting" aria-live="polite"></p>

    <p><a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Visit Instagram</a></p>
  </main>

  <script>
    // Task 3: alert when the page loads.
    alert("Welcome to your Insta Bio-Link Page!");

    // Tasks 4–6: console messages for practice.
    console.log("Hello from the console!");
    console.log("JS is running!");

    // Task 7: button click shows a personalised bio alert.
    document.getElementById("show-bio").addEventListener("click", function () {
      alert("Hi, I'm Krish! My favorite app is Instagram.");
    });

    // Task 9: show a greeting using JavaScript when clicked.
    document.getElementById("show-greeting").addEventListener("click", function () {
      document.getElementById("greeting").textContent = "Hello from JS!";
      alert("Hello from JS!");
    });

    // Task 10: change the heading color to green when the page loads.
    document.getElementById("food-heading").style.color = "green";
  </script>
</body>
</html>
